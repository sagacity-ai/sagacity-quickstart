# Quickstart is a CommandLineRunner — no web server needed
spring.main.web-application-type=none

# Set your OpenAI API key via environment variable:
# export SPRING_AI_OPENAI_API_KEY=sk-...
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}

# Optional: connect to Sagacity Cloud dashboard
# export SAGACITY_CLOUD_API_KEY=your-api-key
sagacity.cloud.api-key=${SAGACITY_CLOUD_API_KEY:}
sagacity.cloud.base-url=https://sagacity-cloud-api.hardhustle1988.workers.dev
