# ─────────────────────────────────────────────────────
# Sagacity Quickstart
# No API key required — runs entirely with simulated tool calls.
# ─────────────────────────────────────────────────────

server:
  port: 8080

spring:
  main:
    web-application-type: servlet   # required for Spring Boot 4 — also set as JVM arg in pom.xml

sagacity:
  enabled: true
  schema-init: true
  ui-enabled: true          # /sagacity/ui — embedded approval dashboard

# Optional: set your OpenAI key to enable real LLM calls
